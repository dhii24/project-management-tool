services:
  backend-dev:
    profiles:
      - dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: project-management-backend:dev
    container_name: project-management-api-dev
    ports:
      - "5001:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/project_management
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npx nodemon --legacy-watch server.js