services:
  frontend:
    image: project-management-frontend:latest
    container_name: project-management-web
    ports:
      - "8081:80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: project-management-backend:latest
    depends_on:
      mongo:
        condition: service_healthy
    container_name: project-management-api
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    secrets:
      - mongo_uri
      - jwt_secret
    restart: unless-stopped
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  mongo:
    image: mongo:8
    container_name: project-management-mongo
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  mongo_uri:
    file: ./secrets/mongo_uri.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  mongodb_data: